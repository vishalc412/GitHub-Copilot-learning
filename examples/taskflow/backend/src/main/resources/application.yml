spring:
  application:
    name: taskflow

  # In-memory H2 so `mvn spring-boot:run` works with zero local setup.
  # Swap to Postgres via docker-compose.yml when you want persistence —
  # see README "Running against Postgres".
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    # Never leave a session open for the whole request in a real service.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    # Errors are produced by GlobalExceptionHandler as problem+json;
    # never let a stack trace reach a client.
    include-stacktrace: never
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

taskflow:
  # Seed demo rows on startup so the UI is not empty on a fresh clone.
  seed-demo-data: true
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.example.taskflow: DEBUG
